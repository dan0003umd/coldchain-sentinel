AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ColdChain Sentinel

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Resources:
  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - {AttributeName: sensor_id, AttributeType: S}
        - {AttributeName: seq_no, AttributeType: N}
        - {AttributeName: shipment_id, AttributeType: S}
        - {AttributeName: timestamp, AttributeType: S}
      KeySchema:
        - {AttributeName: sensor_id, KeyType: HASH}
        - {AttributeName: seq_no, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: by-shipment
          KeySchema:
            - {AttributeName: shipment_id, KeyType: HASH}
            - {AttributeName: timestamp, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: shipment_id, AttributeType: S}
      KeySchema:
        - {AttributeName: shipment_id, KeyType: HASH}

  SensorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: sensor_id, AttributeType: S}
      KeySchema:
        - {AttributeName: sensor_id, KeyType: HASH}

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/validate/
      Handler: app.handler
      Environment:
        Variables:
          READINGS_TABLE: !Ref ReadingsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReadingsTable

  DetectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/detect/
      Handler: app.handler
      Environment:
        Variables:
          READINGS_TABLE: !Ref ReadingsTable
          INCIDENTS_TABLE: !Ref IncidentsTable
          SENSORS_TABLE: !Ref SensorsTable
          SAFE_MIN: "0"
          SAFE_MAX: "5"
          N_CONSECUTIVE: "4"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReadingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SensorsTable
      Events:
        ReadingStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ReadingsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'

  SilenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/silence/
      Handler: app.handler
      Environment:
        Variables:
          SENSORS_TABLE: !Ref SensorsTable
          INCIDENTS_TABLE: !Ref IncidentsTable
          SILENCE_SECONDS: "90"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SensorsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
      Events:
        EveryMinute:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)

  ReadingRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Sql: "SELECT * FROM 'coldchain/readings'"
        RuleDisabled: false
        AwsIotSqlVersion: "2016-03-23"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt ValidateFunction.Arn

  IotInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ValidateFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt ReadingRule.Arn