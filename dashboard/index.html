<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ColdChain Sentinel | Reviewer</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172c32; background: #f3f7f5; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: #123c40; color: #f6fbf8; padding: 22px max(24px, calc((100vw - 1160px) / 2)); display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark { width: 38px; height: 38px; border: 1px solid #82c8af; border-radius: 12px; display: grid; place-items: center; color: #a8e1c9; font-size: 20px; }
    h1 { font-size: 16px; margin: 0; letter-spacing: .01em; }
    .subtitle { color: #b8d1c9; margin-top: 4px; font-size: 12px; }
    main { max-width: 1160px; margin: 44px auto; padding: 0 24px 60px; }
    .eyebrow { color: #387d6b; font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .14em; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    h2 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -.035em; margin: 8px 0 7px; }
    .intro p { color: #60777a; margin: 0; font-size: 14px; }
    .panel { background: #fff; border: 1px solid #dfe9e4; border-radius: 16px; box-shadow: 0 14px 40px #193c3510; overflow: hidden; }
    .toolbar { min-height: 70px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid #e7efeb; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; }
    .count { color: #66807b; font-size: 13px; }
    select, button { font: inherit; }
    select { border: 1px solid #d8e4de; border-radius: 9px; padding: 9px 32px 9px 11px; color: #294448; background: white; }
    button { border: 0; border-radius: 9px; cursor: pointer; padding: 10px 14px; font-size: 13px; font-weight: 700; }
    button:focus-visible, select:focus-visible { outline: 3px solid #77c8a8; outline-offset: 2px; }
    .primary { background: #bdebd5; color: #144a3b; }
    .secondary { border: 1px solid #d8e4de; background: white; color: #34565a; }
    .quiet { background: transparent; color: #d5ebe2; padding: 8px 10px; }
    button:disabled { opacity: .48; cursor: default; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; text-align: left; }
    th { background: #f8fbf9; color: #718783; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 13px 18px; font-weight: 750; }
    td { padding: 16px 18px; border-top: 1px solid #edf2ef; font-size: 13px; color: #294448; }
    tbody tr:hover { background: #fbfdfc; }
    .shipment { font-weight: 750; color: #183d40; }
    .muted { color: #78908a; font-size: 12px; margin-top: 4px; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px; font-size: 10px; font-weight: 800; letter-spacing: .06em; }
    .OPEN { background: #fff1d6; color: #865500; }
    .ESCALATED { background: #fde4e1; color: #a43b30; }
    .RESOLVED { background: #ddf4e8; color: #28714d; }
    .message { padding: 48px 20px; text-align: center; color: #718783; font-size: 14px; }
    .message.error { color: #a43b30; }
    .footer { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid #e7efeb; color: #78908a; font-size: 12px; }
    #auth { display: flex; align-items: center; gap: 10px; }
    #auth-name { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c2ded3; font-size: 12px; }
    @media (max-width: 650px) { header { padding: 17px 18px; } main { margin-top: 32px; padding: 0 15px 40px; } .intro { display: block; } .intro .primary { margin-top: 16px; } .toolbar { align-items: flex-start; flex-direction: column; } #auth-name { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">◈</div>
      <div><h1>ColdChain Sentinel</h1><div class="subtitle">Shipment integrity monitoring</div></div>
    </div>
    <div id="auth"><span id="auth-name"></span><button id="auth-button" class="primary" type="button">Sign in</button></div>
  </header>
  <main>
    <div class="intro">
      <div>
        <div class="eyebrow">Reviewer workspace</div>
        <h2>Shipment incidents</h2>
        <p>Review temperature excursions and silent sensor alerts.</p>
      </div>
      <button id="refresh" class="secondary" type="button" hidden>Refresh incidents</button>
    </div>
    <section class="panel" aria-label="Shipment incidents">
      <div class="toolbar">
        <div class="toolbar-left"><strong>Incidents</strong><span id="count" class="count"></span></div>
        <div class="toolbar-right">
          <label class="count" for="status-filter">Status</label>
          <select id="status-filter" aria-label="Filter by status">
            <option value="">All statuses</option><option value="OPEN">Open</option>
            <option value="ESCALATED">Escalated</option><option value="RESOLVED">Resolved</option>
          </select>
        </div>
      </div>
      <div id="content" class="message">Sign in with your reviewer account to load incidents.</div>
      <div class="footer"><span>Read-only reviewer view</span><button id="next" class="secondary" type="button" hidden>Next page →</button></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const content = $('content');
    const params = new URLSearchParams(window.location.search);
    let config;
    let nextToken = null;

    function setMessage(message, isError = false) {
      content.className = `message${isError ? ' error' : ''}`;
      content.textContent = message;
      $('count').textContent = '';
    }

    function base64url(bytes) {
      let binary = '';
      bytes.forEach((byte) => binary += String.fromCharCode(byte));
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function randomValue(size = 32) {
      const bytes = new Uint8Array(size);
      crypto.getRandomValues(bytes);
      return base64url(bytes);
    }

    async function sha256(value) {
      return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value)));
    }

    function callbackUrl() { return `${window.location.origin}/`; }

    function updateAuth() {
      const token = sessionStorage.getItem('id_token');
      $('auth-button').textContent = token ? 'Sign out' : 'Sign in';
      $('auth-name').textContent = token ? 'Reviewer session active' : '';
      $('refresh').hidden = !token;
      if (!token) $('next').hidden = true;
    }

    async function login() {
      const verifier = randomValue(48);
      const state = randomValue(24);
      const nonce = randomValue(24);
      sessionStorage.setItem('pkce_verifier', verifier);
      sessionStorage.setItem('oauth_state', state);
      sessionStorage.setItem('oauth_nonce', nonce);
      const challenge = base64url(await sha256(verifier));
      const query = new URLSearchParams({
        client_id: config.clientId,
        response_type: 'code',
        scope: 'openid email profile',
        redirect_uri: callbackUrl(),
        state,
        nonce,
        code_challenge: challenge,
        code_challenge_method: 'S256',
      });
      window.location.assign(`https://${config.cognitoDomain}/oauth2/authorize?${query}`);
    }

    async function completeLogin(code, returnedState) {
      const verifier = sessionStorage.getItem('pkce_verifier');
      const expectedState = sessionStorage.getItem('oauth_state');
      const expectedNonce = sessionStorage.getItem('oauth_nonce');
      sessionStorage.removeItem('pkce_verifier');
      sessionStorage.removeItem('oauth_state');
      sessionStorage.removeItem('oauth_nonce');
      if (!verifier || !expectedState || returnedState !== expectedState) {
        throw new Error('Sign-in could not be verified. Please try again.');
      }
      const form = new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: config.clientId,
        code,
        redirect_uri: callbackUrl(),
        code_verifier: verifier,
      });
      const response = await fetch(`https://${config.cognitoDomain}/oauth2/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form,
      });
      const tokens = await response.json();
      if (!response.ok || !tokens.id_token) throw new Error(tokens.error_description || 'Sign-in failed.');
      const encodedPayload = tokens.id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const claims = JSON.parse(atob(encodedPayload.padEnd(Math.ceil(encodedPayload.length / 4) * 4, '=')));
      if (!expectedNonce || claims.nonce !== expectedNonce) throw new Error('Sign-in could not be verified. Please try again.');
      sessionStorage.setItem('id_token', tokens.id_token);
      sessionStorage.setItem('token_expires_at', String(Date.now() + tokens.expires_in * 1000));
      window.history.replaceState({}, document.title, '/');
    }

    function logout() {
      sessionStorage.removeItem('id_token');
      sessionStorage.removeItem('token_expires_at');
      updateAuth();
      setMessage('You have signed out. Sign in to view incidents.');
      const query = new URLSearchParams({ client_id: config.clientId, logout_uri: callbackUrl() });
      window.location.assign(`https://${config.cognitoDomain}/logout?${query}`);
    }

    function cell(text, className = '') {
      const td = document.createElement('td');
      td.textContent = text || '—';
      if (className) td.className = className;
      return td;
    }

    function render(items) {
      content.className = '';
      content.replaceChildren();
      if (!items.length) {
        setMessage('No incidents found for this status.');
        return;
      }
      $('count').textContent = `${items.length} shown`;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const table = document.createElement('table');
      const head = document.createElement('thead');
      const headerRow = document.createElement('tr');
      ['Shipment', 'Issue', 'Status', 'Sensor', 'Opened'].forEach((label) => {
        const th = document.createElement('th'); th.textContent = label; headerRow.append(th);
      });
      head.append(headerRow);
      const body = document.createElement('tbody');
      items.forEach((item) => {
        const row = document.createElement('tr');
        const shipment = document.createElement('td');
        const shipmentName = document.createElement('div'); shipmentName.className = 'shipment'; shipmentName.textContent = item.shipment_id || '—';
        const incidentId = document.createElement('div'); incidentId.className = 'muted'; incidentId.textContent = item.incident_id || '';
        shipment.append(shipmentName, incidentId);
        const status = document.createElement('td');
        const badge = document.createElement('span'); badge.className = `pill ${item.status || ''}`; badge.textContent = item.status || 'UNKNOWN'; status.append(badge);
        row.append(shipment, cell(item.issue_type), status, cell(item.sensor_id), cell(item.opened_at));
        body.append(row);
      });
      table.append(head, body); wrap.append(table); content.append(wrap);
    }

    async function loadIncidents(token = null) {
      const idToken = sessionStorage.getItem('id_token');
      if (!idToken) return setMessage('Sign in with your reviewer account to load incidents.');
      if (Number(sessionStorage.getItem('token_expires_at') || 0) <= Date.now()) {
        sessionStorage.removeItem('id_token'); updateAuth();
        return setMessage('Your sign-in expired. Sign in again to continue.');
      }
      setMessage('Loading incidents…');
      const query = new URLSearchParams({ limit: '50' });
      const status = $('status-filter').value;
      if (status) query.set('status', status);
      if (token) query.set('nextToken', token);
      try {
        const response = await fetch(`${config.apiUrl}/incidents?${query}`, {
          headers: { Authorization: idToken },
          cache: 'no-store',
        });
        if (response.status === 401 || response.status === 403) {
          sessionStorage.removeItem('id_token'); updateAuth();
          throw new Error('Your session is no longer authorized. Sign in again.');
        }
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Could not load incidents.');
        render(result.items || []);
        nextToken = result.nextToken || null;
        $('next').hidden = !nextToken;
      } catch (error) {
        setMessage(error.message || 'Could not load incidents.', true);
      }
    }

    async function start() {
      try {
        const response = await fetch('/config.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Dashboard configuration is missing. Run the dashboard deploy script.');
        config = await response.json();
        if (params.has('error')) throw new Error(params.get('error_description') || 'Sign-in was canceled.');
        if (params.has('code')) await completeLogin(params.get('code'), params.get('state'));
        updateAuth();
        if (sessionStorage.getItem('id_token')) loadIncidents();
      } catch (error) {
        setMessage(error.message || 'Dashboard setup failed.', true);
      }
    }

    $('auth-button').addEventListener('click', () => {
      if (sessionStorage.getItem('id_token')) logout(); else login();
    });
    $('refresh').addEventListener('click', () => loadIncidents());
    $('status-filter').addEventListener('change', () => loadIncidents());
    $('next').addEventListener('click', () => loadIncidents(nextToken));
    start();
  </script>
</body>
</html>
